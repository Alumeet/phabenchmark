name: List a personal health agent
description: Submit an agent for the PHA Benchmark directory
title: "Listing: "
labels: [listing]
body:
  - type: markdown
    attributes:
      value: |
        Requests on this repository are **public**. Don't include private contact details — the conversation about the listing happens on this issue.
  - type: input
    id: name
    attributes:
      label: Agent name
    validations:
      required: true
  - type: input
    id: maker
    attributes:
      label: Maker
      description: Company, lab, or your own name.
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Website
      placeholder: "https://"
    validations:
      required: false
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Companion & coaching
        - Symptom & triage
        - Mental health
        - Health data analysis
        - Research
        - Other
  - type: dropdown
    id: status
    attributes:
      label: Status
      options:
        - Live
        - Beta
        - In development
        - Research preview
        - Retired
  - type: textarea
    id: desc
    attributes:
      label: What it does
      description: One or two sentences, plain English.
    validations:
      required: true
  - type: input
    id: data
    attributes:
      label: Data it works with
      description: "E.g. wearables, chat, labs. Optional."
    validations:
      required: false
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmations
      options:
        - label: I'm the maker of this agent, or authorized to list it.
          required: true
        - label: I understand the listing is reviewed before publication and never presented as tested.
          required: true
